plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0'
group = 'com.example.charmobmaker'

base {
    archivesName = 'charmobmaker'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                charmobmaker {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// gradlew runGameTestServer -Psmoke: a real headless server with the mod, runs src/smoke. Never part of the normal jar.
// gradlew build -Psmoke -x test: a jar with ClientChecks in it, for python tools/run_real_client.py
if (project.hasProperty('smoke')) {
    sourceSets.main.java.srcDir 'src/smoke/java'
    sourceSets.main.resources.srcDir 'src/smoke/resources'
    minecraft.runs {
        gameTestServer {
            workingDirectory project.file('run-smoke')
            property 'forge.enabledGameTestNamespaces', 'charmobmaker'
            property 'forge.logging.console.level', 'info'
            mods {
                charmobmaker {
                    source sourceSets.main
                }
            }
        }
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title'   : 'charmobmaker',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion
        ])
    }
}
